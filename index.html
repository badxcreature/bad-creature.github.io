.menu.active{

box-shadow:0 0 30px rgba(53,185,255,.12);
}

.release-title{

font-size:1.7rem;

color:#888;

font-size:.9rem;

}

padding:18px;

background:var(--card);
border:1px solid var(--border);
color:white;
text-decoration:none;
text-align:center;
font-weight:700;
letter-spacing:2px;
border-radius:12px;
transition:.25s;

.button:hover{

.spotify:hover{
background:#1DB954;
